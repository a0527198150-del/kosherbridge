name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Override kotlin.compiler.execution.strategy (gradle.properties uses
      # 'in-process', which breaks KSP2 on CI runners).
      - name: Build kosherbridge (debug APK)
        run: gradle :kosherbridge:assembleDebug --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=daemon

      - name: Upload kosherbridge APK
        uses: actions/upload-artifact@v4
        with:
          name: kosherbridge-apk
          path: kosherbridge/build/outputs/apk/debug/*.apk
