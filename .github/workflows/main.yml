name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: versionCode is derived from the git commit count.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # Restore the stable signing key so every build shares one signature and
      # updates install over previous versions without uninstalling. Without
      # this, Gradle generates a throwaway debug key per run and each APK has a
      # different signature (install over old version fails).
      # Hardened: a missing secret or a corrupt decode fails HERE with a clear
      # error instead of surfacing later as an opaque signing failure. printf
      # (not echo) avoids appending a newline that breaks strict base64 decode
      # on some shells.
      - name: Restore stable debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set" && exit 1
          fi
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          keytool -list -keystore debug.keystore -storepass android > /dev/null \
            || { echo "::error::restored debug.keystore is not a valid keystore" && exit 1; }

      # setup-gradle auto-detects ./gradlew and installs the exact version
      # pinned in gradle/wrapper/gradle-wrapper.properties — so local builds
      # and CI always run the same Gradle 9.3.1.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Unit tests are plain JVM tests (no emulator needed) — see
      # kosherbridge/src/test. A regression in the SLC/AT protocol logic now
      # fails CI instead of shipping silently.
      # One flavour is enough for the unit tests: src/test is shared, and the
      # two products differ only in whether the in-app ADB channel is compiled
      # in. Running plain `test` would run the same suite twice and double the
      # step for no new coverage; the plus sources are still compiled below by
      # assembleRelease, so a break there still fails CI.
      - name: Test kosherbridge
        run: ./gradlew :kosherbridge:testStandardDebugUnitTest --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=daemon

      # A red run must be diagnosable from the run page (the test task only
      # prints a local file:// link), so upload the report on failure.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: kosherbridge-test-report
          path: kosherbridge/build/reports/tests/

      # Lint reports but does not block. That is configured in the module's
      # build.gradle.kts (lint { abortOnError = false }), NOT with
      # continue-on-error: the latter still marks the step failed, so every
      # green run carried a red step and an "exit code 1" that was
      # indistinguishable from a real break.
      - name: Lint kosherbridge
        run: ./gradlew :kosherbridge:lintStandardDebug --no-daemon --continue -Pkotlin.compiler.execution.strategy=daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kosherbridge-lint
          path: kosherbridge/build/reports/lint-results-standardDebug.html

      # :app (the Hebrew budget app) is INTENTIONALLY unbuilt in CI: it is a
      # separate, unrelated application that shares this Gradle root (see the
      # root README). Building it would require the GEMINI_API_KEY / .env
      # handling and Firebase setup that CI does not provide. This omission is
      # a decision, not an oversight.

      # RELEASE, not debug: this APK is what people install. A debug build
      # carries the debuggable flag and is not what should be handed out. Both
      # build types are signed with the same stable key (see build.gradle.kts),
      # so a release APK still installs over an earlier debug one.
      # Minification stays OFF by design - see the note in build.gradle.kts.
      # Override kotlin.compiler.execution.strategy (gradle.properties uses
      # 'in-process', which breaks KSP2 on CI runners).
      # Builds BOTH products: `standard` (no network permission at all) and
      # `plus` (adds android.permission.INTERNET and the in-app ADB channel).
      # See the productFlavors block in kosherbridge/build.gradle.kts for why
      # that choice is left to the person installing it.
      - name: Build kosherbridge (release APKs)
        run: ./gradlew :kosherbridge:assembleRelease --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=daemon

      # The standard APK must never gain a network permission. That is the
      # whole reason the two products exist, and it is exactly the kind of
      # promise that decays silently: any library added later can merge
      # <uses-permission android:name="android.permission.INTERNET"/> into the
      # manifest without a line of it appearing in this repository, and nobody
      # would notice until someone read the permission list of a shipped build.
      #
      # So it is checked on the built artifact rather than on the sources, with
      # aapt2 reading the APK's own manifest - the merged, final one people
      # actually install. A regression fails the build here instead of reaching
      # a user. The plus APK is asserted in the same breath: its permission must
      # be present, or the ADB channel silently cannot open its loopback socket
      # and the flavour is pointless.
      - name: Assert the permission split holds
        run: |
          set -e
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then echo "::error::aapt2 not found" && exit 1; fi
          STD=kosherbridge/build/outputs/apk/standard/release/kosherbridge-standard-release.apk
          PLUS=kosherbridge/build/outputs/apk/plus/release/kosherbridge-plus-release.apk
          if "$AAPT2" dump permissions "$STD" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the standard APK declares INTERNET - the permission split is broken"
            "$AAPT2" dump permissions "$STD"
            exit 1
          fi
          if ! "$AAPT2" dump permissions "$PLUS" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the plus APK is missing INTERNET - its ADB channel cannot work"
            exit 1
          fi
          echo "standard: no INTERNET. plus: INTERNET present. Split holds."

      # Name every downloadable by its version. Without this each run produced
      # "kosherbridge-apk" and "kosherbridge-magisk-v1.zip", so once downloaded
      # no file said which build it was - and two of them in a folder were
      # indistinguishable.
      - name: Resolve version
        id: ver
        run: echo "version=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the APKs under their version
        run: |
          mkdir -p dist
          cp kosherbridge/build/outputs/apk/standard/release/kosherbridge-standard-release.apk \
             "dist/KosherBridge-${{ steps.ver.outputs.version }}.apk"
          cp kosherbridge/build/outputs/apk/plus/release/kosherbridge-plus-release.apk \
             "dist/KosherBridge-${{ steps.ver.outputs.version }}-plus.apk"

      # The default download. No INTERNET permission in the manifest at all.
      - name: Upload kosherbridge APK (standard)
        uses: actions/upload-artifact@v5
        with:
          name: KosherBridge-${{ steps.ver.outputs.version }}-apk
          path: dist/KosherBridge-${{ steps.ver.outputs.version }}.apk

      # Same app plus the in-app ADB channel, which needs INTERNET to reach the
      # player's own ADB daemon over 127.0.0.1. Offered separately so nobody
      # gets that permission without choosing it.
      - name: Upload kosherbridge APK (plus)
        uses: actions/upload-artifact@v5
        with:
          name: KosherBridge-${{ steps.ver.outputs.version }}-apk-plus
          path: dist/KosherBridge-${{ steps.ver.outputs.version }}-plus.apk

      # Package the built APK into the Magisk module (final solution for rooted
      # players: installs the app as a system priv-app with BLUETOOTH_PRIVILEGED
      # and disables hidden-API enforcement at boot).
      - name: Package Magisk module
        run: |
          sh magisk-module/build.sh \
            kosherbridge/build/outputs/apk/standard/release/kosherbridge-standard-release.apk \
            "${{ steps.ver.outputs.version }}"

      - name: Upload Magisk module
        uses: actions/upload-artifact@v5
        with:
          name: KosherBridge-${{ steps.ver.outputs.version }}-magisk-module
          path: kosherbridge-magisk-${{ steps.ver.outputs.version }}.zip
